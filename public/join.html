<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Participant Registration</title><link rel="stylesheet" href="/style.css?v=49"></head><body><header class=sitebar><img src="/assets/logo-dark.png" class=brand><span class=chip>PARTICIPANT</span></header><main class="wrap participantPage"><div class=eyebrow>PERFICIENT OFFICE QUIZ</div><h1>Enter the Arena</h1><div id=connection class="box status">Connecting…</div><div id=form><input id=room placeholder="Room code" maxlength=4 inputmode="numeric" pattern="[0-9]{4}" autocomplete="off"><input id=name placeholder="Full name" autocomplete="name" inputmode="text" pattern="[A-Za-z]+(?:[ ][A-Za-z]+)*"><input id=emp placeholder="Register number" maxlength=12 inputmode="numeric" pattern="[0-9]+" autocomplete="off"><button class="primary big" onclick=join()>Register & Join</button></div><div id=game class="hidden playerLiveGame">
