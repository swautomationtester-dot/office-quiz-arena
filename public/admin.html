<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="eyebrow">ADMIN</div><h2>Question Bank</h2><div id="login"><input id="pass" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button></div><div id="admin" class="hidden"><input id="qt" placeholder="Question"><input id="a" placeholder="Option A"><input id="b" placeholder="Option B"><input id="c" placeholder="Option C"><input id="d" placeholder="Option D"><select id="ans"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><input id="pts" type="number" value="100" placeholder="Points"><button class="primary" onclick="add()">Add Question</button><div id="list"></div></div></main><script src="admin.js"></script></body></html>
